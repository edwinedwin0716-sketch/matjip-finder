<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리동네 맛·볼거리</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#0a1430; --bg2:#101f47; --card:#15275a; --line:#24396f;
    --text:#eaf0ff; --muted:#9fb0d8; --red:#e63946; --red-h:#ff4d5a; --red-d:#b71c2b;
    --gold:#ffd166;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,#071026 100%);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
  header h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px}
  header h1 span{color:var(--red)}
  header p{margin:0 0 20px;color:var(--muted)}
  .search{display:flex;gap:8px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);padding:12px;border-radius:14px}
  .search input{flex:1 1 240px;min-width:0;background:#0b1838;border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:10px;font-size:16px}
  .search select{background:#0b1838;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;font-size:15px}
  .btn{background:var(--red);color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:700;font-size:15px;
    cursor:pointer;transition:.15s;box-shadow:0 4px 14px rgba(230,57,70,.35)}
  .btn:hover{background:var(--red-h);transform:translateY(-1px)}
  .btn:active{background:var(--red-d);transform:none}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:transparent;border:1px solid var(--red);color:var(--red);box-shadow:none}
  .btn.ghost:hover{background:rgba(230,57,70,.12)}
  .status{margin:14px 2px;color:var(--muted);min-height:20px}
  .status.err{color:#ff8a93}
  .hidden{display:none!important}
  h2{font-size:18px;margin:26px 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:999px;
    cursor:pointer;font-size:14px;transition:.15s}
  .chip b{color:var(--muted);font-weight:500;margin-left:4px}
  .chip:hover{border-color:var(--red)}
  .chip.on{background:var(--red);border-color:var(--red)}
  .chip.on b{color:#ffe1e3}
  .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:8px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  #map{height:420px;border-radius:14px;border:1px solid var(--line);background:var(--bg2)}
  .pick{background:linear-gradient(135deg,#1b2f6b,#15275a);border:1px solid var(--red);border-radius:14px;padding:16px;margin-bottom:14px}
  .pick .tag{color:var(--gold);font-size:13px;font-weight:700}
  .pick h3{margin:6px 0 4px;font-size:22px}
  .pick .meta{color:var(--muted);font-size:14px}
  .pick .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:4px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;
    justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
  .item:hover{border-color:var(--red)}
  .item .n{font-weight:600}
  .item .s{color:var(--muted);font-size:13px}
  .item .d{color:var(--gold);font-size:13px;white-space:nowrap}
  a.lnk{color:#fff;text-decoration:none;font-size:13px;padding:7px 12px;border-radius:8px;background:var(--red)}
  a.lnk.alt{background:transparent;border:1px solid var(--line);color:var(--text)}
  .note{color:var(--muted);font-size:12px;margin-top:30px;line-height:1.6}
  .dark-tiles{filter:invert(1) hue-rotate(200deg) brightness(.85) contrast(.9) saturate(.6)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#15275a;color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>우리동네 <span>맛</span>·볼거리</h1>
    <p>거주지를 입력하면 주변 음식점과 볼거리를 모아서, 원하는 종류의 음식을 추천해드려요.</p>
  </header>

  <form class="search" id="form">
    <input id="addr" placeholder="예: 서울 마포구 연남동, 부산 해운대구" autocomplete="off" required>
    <select id="radius">
      <option value="500">반경 500m</option>
      <option value="1000" selected>반경 1km</option>
      <option value="2000">반경 2km</option>
      <option value="3000">반경 3km</option>
    </select>
    <button class="btn" id="go" type="submit">🔍 동네 탐색</button>
  </form>
  <div class="status" id="status"></div>

  <section id="result" class="hidden">
    <h2>🍽️ 어떤 음식이 땡기세요?</h2>
    <div class="chips" id="cats"></div>

    <div class="grid">
      <div>
        <h2>🗺️ 지도</h2>
        <div id="map"></div>
      </div>
      <div>
        <h2 id="recTitle">⭐ 추천</h2>
        <div class="pick hidden" id="pick"></div>
        <div class="list" id="foodList"></div>
      </div>
    </div>

    <h2>📸 주변 볼거리 <span id="sightCount" style="color:var(--muted);font-weight:400;font-size:14px"></span></h2>
    <div class="list" id="sightList" style="max-height:320px"></div>
  </section>

  <p class="note">데이터: OpenStreetMap(Nominatim·Overpass API). 등록된 정보만 표시되며, 음식 종류는 태그와 상호명으로 자동 분류됩니다.
    영업 여부·평점은 카카오맵/네이버지도 링크에서 확인하세요.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const OVERPASS = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const CATS = ["전체","한식","고기·구이","중식","일식","양식","아시안","치킨","패스트푸드","분식","카페·디저트","술집·바","기타"];
const ICON = {"한식":"🍚","고기·구이":"🥩","중식":"🥟","일식":"🍣","양식":"🍝","아시안":"🍜","치킨":"🍗","패스트푸드":"🍔",
  "분식":"🍢","카페·디저트":"☕","술집·바":"🍺","기타":"🍴","전체":"✨"};

let center=null, foods=[], sights=[], current="전체", map=null, layer=null, homeMarker=null;

function setStatus(msg, err){ const el=$("#status"); el.textContent=msg; el.classList.toggle("err",!!err); }

function classify(t){
  const c=(t.cuisine||"").toLowerCase(), n=((t.name||"")+" "+(t.cuisine||"")).toLowerCase(), a=t.amenity; // 한글 cuisine 태그도 상호명 규칙으로 분류
  if(a==="bar"||a==="pub"||/호프|포차|와인바|술집|맥주|brew|wine/.test(n)) return "술집·바";
  if(a==="cafe"||a==="ice_cream"||/coffee|cafe|dessert|cake|bubble_tea|donut|bakery|ice_cream/.test(c)||/카페|커피|베이커리|빵|디저트|케이크|cafe|coffee|bakery|starbucks/.test(n)) return "카페·디저트";
  if(/chicken/.test(c)||/치킨|통닭|chicken/.test(n)) return "치킨";
  if(/bbq|barbecue|meat|grill|steak_house/.test(c)||/고기|갈비|삼겹|곱창|막창|정육|한우|구이|족발|보쌈/.test(n)) return "고기·구이";
  if(/burger|pizza|sandwich|hot_dog|kebab/.test(c)||a==="fast_food"&&!c||/버거|피자|맥도날드|롯데리아|서브웨이|kfc|맘스터치|pizza|burger|subway/.test(n)) return "패스트푸드";
  if(/tteokbokki|gimbap|snack/.test(c)||/분식|떡볶이|김밥|순대|튀김/.test(n)) return "분식";
  if(/chinese|dumpling/.test(c)||/중식|짜장|짬뽕|중화|반점|마라|훠궈|양꼬치|딤섬|중국/.test(n)) return "중식";
  if(/japanese|sushi|ramen|udon|soba|sashimi|tonkatsu|donburi/.test(c)||/일식|스시|초밥|라멘|우동|돈까스|돈카츠|오마카세|횟집|덮밥|이자카야|sushi|ramen/.test(n)) return "일식";
  if(/italian|french|western|american|pasta|spanish|mexican|european|steak|brunch/.test(c)||/양식|파스타|스테이크|브런치|비스트로|트라토리아|타코|pasta|bistro|trattoria|brunch|taco/.test(n)) return "양식";
  if(/thai|vietnamese|indian|asian|pho|nepalese|indonesian|malaysian/.test(c)||/쌀국수|포|태국|베트남|인도|커리|카레/.test(n)) return "아시안";
  if(/korean|noodle|soup|bibimbap/.test(c)||/한식|국밥|찌개|탕|냉면|칼국수|한정식|백반|국수|비빔밥|해장|순두부|감자탕|닭갈비|찜/.test(n)) return "한식";
  return "기타";
}

function dist(a,b){ // meters (haversine)
  const R=6371000, r=x=>x*Math.PI/180, dLat=r(b.lat-a.lat), dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmt = m => m<1000 ? Math.round(m)+"m" : (m/1000).toFixed(1)+"km";
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function sightType(t){
  if(t.tourism==="museum") return "박물관";
  if(t.tourism==="gallery") return "갤러리";
  if(t.tourism==="viewpoint") return "전망 명소";
  if(t.tourism==="theme_park") return "테마파크";
  if(t.tourism==="zoo"||t.tourism==="aquarium") return "동물원·아쿠아리움";
  if(t.leisure==="park") return "공원";
  if(t.historic) return "역사 유적";
  return "관광 명소";
}

async function geocode(q){
  const u="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q="+encodeURIComponent(q);
  const r=await fetch(u,{headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error("주소 검색 실패 ("+r.status+")");
  const j=await r.json();
  if(!j.length) throw new Error("주소를 찾지 못했어요. 시·구·동 단위로 다시 입력해 보세요.");
  return {lat:+j[0].lat, lon:+j[0].lon, label:j[0].display_name};
}

async function overpass(lat,lon,R){
  const a=`(around:${R},${lat},${lon})`;
  // 음식점과 볼거리를 따로 출력해서 음식점이 많아도 볼거리가 잘리지 않게 함
  const q=`[out:json][timeout:25];
    nwr${a}["amenity"~"^(restaurant|fast_food|cafe|bar|pub|food_court|ice_cream)$"]["name"];out center 800;
    (nwr${a}["tourism"~"^(attraction|museum|gallery|viewpoint|theme_park|zoo|aquarium)$"]["name"];
     nwr${a}["leisure"="park"]["name"];
     nwr${a}["historic"]["name"];);out center 150;`;
  let lastErr;
  for(const ep of OVERPASS){
    try{
      const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      if(!r.ok) throw new Error("데이터 서버 응답 "+r.status);
      return (await r.json()).elements;
    }catch(e){ lastErr=e; }
  }
  throw lastErr;
}

function initMap(){
  if(map) return;
  map=L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {attribution:'&copy; OpenStreetMap',maxZoom:19,className:"dark-tiles"}).addTo(map);
  layer=L.layerGroup().addTo(map);
}

function dot(color){ return L.divIcon({className:"",html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 6px ${color}"></div>`,iconSize:[14,14]}); }

function links(p){
  const k=`https://map.kakao.com/link/map/${encodeURIComponent(p.name)},${p.lat},${p.lon}`;
  const n=`https://map.naver.com/p/search/${encodeURIComponent(p.name)}`;
  return `<a class="lnk" href="${k}" target="_blank" rel="noopener">카카오맵</a><a class="lnk alt" href="${n}" target="_blank" rel="noopener">네이버지도</a>`;
}

function renderCats(){
  const counts={}; foods.forEach(f=>counts[f.cat]=(counts[f.cat]||0)+1);
  $("#cats").innerHTML=CATS.filter(c=>c==="전체"||counts[c]).map(c=>
    `<button class="chip ${c===current?"on":""}" data-c="${c}">${ICON[c]} ${c}<b>${c==="전체"?foods.length:counts[c]}</b></button>`).join("");
}

function filtered(){ return current==="전체"?foods:foods.filter(f=>f.cat===current); }

function renderFoods(){
  const list=filtered();
  $("#recTitle").textContent=`⭐ ${current} 추천 (${list.length}곳)`;
  $("#foodList").innerHTML=list.length?list.map((f,i)=>`<div class="item" data-i="${foods.indexOf(f)}">
      <div><div class="n">${ICON[f.cat]} ${esc(f.name)}</div><div class="s">${f.cat}${f.cuisine?" · "+esc(f.cuisine):""}</div></div>
      <div class="d">${fmt(f.d)}</div></div>`).join("")
    :`<div class="s" style="color:var(--muted)">이 종류의 음식점이 없어요. 반경을 넓혀보세요.</div>`;
  drawMap(list);
  recommend();
}

function renderSights(){
  $("#sightCount").textContent=`(${sights.length}곳)`;
  $("#sightList").innerHTML=sights.length?sights.map((s,i)=>`<div class="item" data-s="${i}">
      <div><div class="n">📍 ${esc(s.name)}</div><div class="s">${s.type}</div></div>
      <div class="d">${fmt(s.d)}</div></div>`).join("")
    :`<div class="s" style="color:var(--muted)">등록된 볼거리가 없어요.</div>`;
}

function drawMap(list){
  layer.clearLayers();
  list.forEach(f=>L.marker([f.lat,f.lon],{icon:dot("#e63946")}).bindPopup(`<b>${esc(f.name)}</b><br>${f.cat} · ${fmt(f.d)}`).addTo(layer));
  sights.forEach(s=>L.marker([s.lat,s.lon],{icon:dot("#ffd166")}).bindPopup(`<b>${esc(s.name)}</b><br>${s.type} · ${fmt(s.d)}`).addTo(layer));
}

// 가까울수록 뽑힐 확률이 높은 가중 랜덤 추천
function recommend(){
  const list=filtered(), box=$("#pick");
  if(!list.length){ box.classList.add("hidden"); return; }
  const w=list.map(f=>1/(1+f.d/300)); let r=Math.random()*w.reduce((a,b)=>a+b,0), p=list[0];
  for(let i=0;i<list.length;i++){ r-=w[i]; if(r<=0){p=list[i];break;} }
  const near=sights.map(s=>({...s,dd:dist(p,s)})).sort((a,b)=>a.dd-b.dd)[0];
  box.innerHTML=`<div class="tag">🎯 오늘은 여기 어때요?</div>
    <h3>${ICON[p.cat]} ${esc(p.name)}</h3>
    <div class="meta">${p.cat}${p.cuisine?" · "+esc(p.cuisine):""} · 기준점에서 ${fmt(p.d)}${p.hours?"<br>🕒 "+esc(p.hours):""}</div>
    ${near?`<div class="meta" style="margin-top:6px">식후 코스 👉 <b style="color:var(--gold)">${esc(near.name)}</b> (${near.type}, ${fmt(near.dd)})</div>`:""}
    <div class="row"><button class="btn" id="again" type="button">🎲 다른 곳 추천</button>${links(p)}</div>`;
  box.classList.remove("hidden");
  $("#again").onclick=recommend;
  map.setView([p.lat,p.lon],16); L.popup().setLatLng([p.lat,p.lon]).setContent(`<b>${esc(p.name)}</b>`).openOn(map);
}

$("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("#addr").value.trim(), R=+$("#radius").value; if(!q) return;
  try{ localStorage.setItem("matjip-addr",q); }catch(_){}
  $("#go").disabled=true;
  try{
    setStatus("📍 주소를 찾는 중...");
    center=await geocode(q);
    setStatus("🔎 주변 음식점·볼거리를 수집하는 중... (최대 20초)");
    const els=await overpass(center.lat,center.lon,R);
    const seen=new Set(); foods=[]; sights=[];
    for(const el of els){
      const t=el.tags||{}, lat=el.lat??el.center?.lat, lon=el.lon??el.center?.lon;
      if(!t.name||lat==null) continue;
      const key=t.name+"|"+lat.toFixed(4)+lon.toFixed(4); if(seen.has(key)) continue; seen.add(key);
      const p={name:t["name:ko"]||t.name,lat,lon,d:dist(center,{lat,lon})};
      if(t.amenity) foods.push({...p,cat:classify(t),cuisine:t.cuisine?.split(";")[0]||"",hours:t.opening_hours||""});
      else sights.push({...p,type:sightType(t)});
    }
    foods.sort((a,b)=>a.d-b.d); sights.sort((a,b)=>a.d-b.d);
    current="전체";
    $("#result").classList.remove("hidden");
    initMap(); map.invalidateSize();
    if(homeMarker) homeMarker.remove();
    homeMarker=L.marker([center.lat,center.lon],{icon:dot("#4ea8ff")}).bindPopup("🏠 기준 위치").addTo(map);
    map.setView([center.lat,center.lon],R<=1000?15:14);
    setStatus(`✅ ${center.label.split(",").slice(0,3).join(",")} 주변 — 음식점 ${foods.length}곳, 볼거리 ${sights.length}곳`);
    renderCats(); renderSights(); renderFoods();
  }catch(err){
    setStatus("⚠️ "+(err.message||"오류가 발생했어요. 잠시 후 다시 시도해 주세요."),true);
  }finally{ $("#go").disabled=false; }
});

$("#cats").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  current=b.dataset.c; renderCats(); renderFoods();
});
$("#foodList").addEventListener("click",e=>{
  const it=e.target.closest(".item"); if(!it) return; const f=foods[+it.dataset.i];
  map.setView([f.lat,f.lon],17);
  L.popup().setLatLng([f.lat,f.lon]).setContent(`<b>${esc(f.name)}</b><br>${f.cat} · ${fmt(f.d)}<div style="margin-top:8px;display:flex;gap:6px">${links(f)}</div>`).openOn(map);
});
$("#sightList").addEventListener("click",e=>{
  const it=e.target.closest(".item"); if(!it) return; const s=sights[+it.dataset.s];
  map.setView([s.lat,s.lon],16);
  L.popup().setLatLng([s.lat,s.lon]).setContent(`<b>${esc(s.name)}</b><br>${s.type}<div style="margin-top:8px;display:flex;gap:6px">${links(s)}</div>`).openOn(map);
  window.scrollTo({top:$("#map").getBoundingClientRect().top+scrollY-20,behavior:"smooth"});
});

try{ const saved=localStorage.getItem("matjip-addr"); if(saved) $("#addr").value=saved; }catch(_){}
</script>
</body>
</html>
