<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="맛·볼거리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>우리동네 맛·볼거리</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#0a1430; --bg2:#101f47; --card:#15275a; --line:#24396f;
    --text:#eaf0ff; --muted:#9fb0d8; --red:#e63946; --red-h:#ff4d5a; --red-d:#b71c2b;
    --gold:#ffd166;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,#071026 100%);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  header h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px}
  header h1 span{color:var(--red)}
  header p{margin:0 0 20px;color:var(--muted)}
  .search{display:flex;gap:8px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);padding:12px;border-radius:14px}
  .search input{flex:1 1 240px;min-width:0;background:#0b1838;border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:10px;font-size:16px}
  .search select{background:#0b1838;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;font-size:15px}
  .btn{background:var(--red);color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:700;font-size:15px;
    cursor:pointer;transition:.15s;box-shadow:0 4px 14px rgba(230,57,70,.35)}
  .btn:hover{background:var(--red-h);transform:translateY(-1px)}
  .btn:active{background:var(--red-d);transform:none}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:transparent;border:1px solid var(--red);color:var(--red);box-shadow:none}
  .btn.ghost:hover{background:rgba(230,57,70,.12)}
  .status{margin:14px 2px;color:var(--muted);min-height:20px}
  .status.err{color:#ff8a93}
  .hidden{display:none!important}
  h2{font-size:18px;margin:26px 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:999px;
    cursor:pointer;font-size:14px;transition:.15s}
  .chip b{color:var(--muted);font-weight:500;margin-left:4px}
  .chip:hover{border-color:var(--red)}
  .chip.on{background:var(--red);border-color:var(--red)}
  .chip.on b{color:#ffe1e3}
  .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:8px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  #map{height:420px;border-radius:14px;border:1px solid var(--line);background:var(--bg2)}
  .pick{background:linear-gradient(135deg,#1b2f6b,#15275a);border:1px solid var(--red);border-radius:14px;padding:16px;margin-bottom:14px}
  .pick .tag{color:var(--gold);font-size:13px;font-weight:700}
  .pick h3{margin:6px 0 4px;font-size:22px}
  .pick .meta{color:var(--muted);font-size:14px}
  .pick .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:4px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;
    justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
  .item:hover{border-color:var(--red)}
  .item .n{font-weight:600}
  .item .s{color:var(--muted);font-size:13px}
  .item .d{color:var(--gold);font-size:13px;white-space:nowrap}
  a.lnk{color:#fff;text-decoration:none;font-size:13px;padding:7px 12px;border-radius:8px;background:var(--red)}
  a.lnk.alt{background:transparent;border:1px solid var(--line);color:var(--text)}
  .note{color:var(--muted);font-size:12px;margin-top:30px;line-height:1.6}
  .loc{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:#0b1838;border:1px solid var(--line);
    color:var(--text);padding:12px 14px;border-radius:10px;font-size:16px;cursor:pointer;text-align:left}
  .loc:hover{border-color:var(--red)}
  .loc #locLabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .loc .chg{background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
  .btn.full{width:100%;margin-top:10px}
  .modal{position:fixed;inset:0;background:rgba(3,8,22,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:2000}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 32px);
    overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .mhead h3{margin:0;font-size:20px}
  .x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
  .msearch{display:flex;gap:8px}
  .msearch input{flex:1;min-width:0;background:#0b1838;border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;font-size:16px}
  .cands{display:flex;flex-direction:column;gap:6px;margin:12px 0;max-height:200px;overflow:auto}
  .cands .lbl{color:var(--muted);font-size:12px;margin:2px 2px 0}
  .cand{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;color:var(--text);font-size:14px}
  .cand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .cand:hover,.cand.on{border-color:var(--red)}
  .cand.on{background:#2a1f45}
  #pmap{height:240px;border-radius:12px;border:1px solid var(--line)}
  .hint{color:var(--muted);font-size:12px;margin:6px 2px 0}
  .mfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
  .sel{flex:1;min-width:0}
  .sel small{display:block;color:var(--muted);font-size:12px}
  .sel span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .dark-tiles{filter:invert(1) hue-rotate(200deg) brightness(.85) contrast(.9) saturate(.6)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#15275a;color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>우리동네 <span>맛</span>·볼거리</h1>
    <p>거주지를 입력하면 주변 음식점과 볼거리를 모아서, 원하는 종류의 음식을 추천해드려요.</p>
  </header>

  <div class="search">
    <button class="loc" id="locBtn" type="button"><span class="pin">📍</span><span id="locLabel">위치를 선택하세요</span><span class="chg">변경</span></button>
    <select id="radius">
      <option value="500">반경 500m</option>
      <option value="1000" selected>반경 1km</option>
      <option value="2000">반경 2km</option>
      <option value="3000">반경 3km</option>
    </select>
    <button class="btn" id="go" type="button">🔍 동네 탐색</button>
  </div>
  <div class="status" id="status"></div>

  <section id="result" class="hidden">
    <h2>🍽️ 어떤 음식이 땡기세요?</h2>
    <div class="chips" id="cats"></div>

    <div class="grid">
      <div>
        <h2>🗺️ 지도</h2>
        <div id="map"></div>
      </div>
      <div>
        <h2 id="recTitle">⭐ 추천</h2>
        <div class="pick hidden" id="pick"></div>
        <div class="list" id="foodList"></div>
      </div>
    </div>

    <h2>📸 주변 볼거리 <span id="sightCount" style="color:var(--muted);font-weight:400;font-size:14px"></span></h2>
    <div class="list" id="sightList" style="max-height:320px"></div>
  </section>

  <p class="note">데이터: OpenStreetMap(Nominatim·Overpass API). 등록된 정보만 표시되며, 음식 종류는 태그와 상호명으로 자동 분류됩니다.
    영업 여부·평점은 카카오맵/네이버지도 링크에서 확인하세요.</p>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="sheet">
    <div class="mhead"><h3 id="mtitle">📍 위치 선택</h3><button class="x" id="mclose" type="button" aria-label="닫기">✕</button></div>
    <form class="msearch" id="mform">
      <input id="maddr" placeholder="동네·주소·역 이름 (예: 강남역, 해운대구 우동)" autocomplete="off">
      <button class="btn" type="submit">검색</button>
    </form>
    <button class="btn ghost full" id="gps" type="button">📡 현재 내 위치 사용</button>
    <div class="cands" id="cands"></div>
    <div id="pmap"></div>
    <div class="hint">💡 지도를 눌러서 위치를 직접 찍을 수도 있어요.</div>
    <div class="mfoot">
      <div class="sel"><small>선택한 위치</small><span id="pickLabel">아직 없음</span></div>
      <button class="btn" id="confirm" type="button" disabled>이 위치로 탐색</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const OVERPASS = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const CATS = ["전체","한식","고기·구이","중식","일식","양식","아시안","치킨","패스트푸드","분식","카페·디저트","술집·바","기타"];
const ICON = {"한식":"🍚","고기·구이":"🥩","중식":"🥟","일식":"🍣","양식":"🍝","아시안":"🍜","치킨":"🍗","패스트푸드":"🍔",
  "분식":"🍢","카페·디저트":"☕","술집·바":"🍺","기타":"🍴","전체":"✨"};

let center=null, foods=[], sights=[], current="전체", map=null, layer=null, homeMarker=null;

function setStatus(msg, err){ const el=$("#status"); el.textContent=msg; el.classList.toggle("err",!!err); }

function classify(t){
  const c=(t.cuisine||"").toLowerCase(), n=((t.name||"")+" "+(t.cuisine||"")).toLowerCase(), a=t.amenity; // 한글 cuisine 태그도 상호명 규칙으로 분류
  if(a==="bar"||a==="pub"||/호프|포차|와인바|술집|맥주|brew|wine/.test(n)) return "술집·바";
  if(a==="cafe"||a==="ice_cream"||/coffee|cafe|dessert|cake|bubble_tea|donut|bakery|ice_cream/.test(c)||/카페|커피|베이커리|빵|디저트|케이크|cafe|coffee|bakery|starbucks/.test(n)) return "카페·디저트";
  if(/chicken/.test(c)||/치킨|통닭|chicken/.test(n)) return "치킨";
  if(/bbq|barbecue|meat|grill|steak_house/.test(c)||/고기|갈비|삼겹|곱창|막창|정육|한우|구이|족발|보쌈/.test(n)) return "고기·구이";
  if(/burger|pizza|sandwich|hot_dog|kebab/.test(c)||a==="fast_food"&&!c||/버거|피자|맥도날드|롯데리아|서브웨이|kfc|맘스터치|pizza|burger|subway/.test(n)) return "패스트푸드";
  if(/tteokbokki|gimbap|snack/.test(c)||/분식|떡볶이|김밥|순대|튀김/.test(n)) return "분식";
  if(/chinese|dumpling/.test(c)||/중식|짜장|짬뽕|중화|반점|마라|훠궈|양꼬치|딤섬|중국/.test(n)) return "중식";
  if(/japanese|sushi|ramen|udon|soba|sashimi|tonkatsu|donburi/.test(c)||/일식|스시|초밥|라멘|우동|돈까스|돈카츠|오마카세|횟집|덮밥|이자카야|sushi|ramen/.test(n)) return "일식";
  if(/italian|french|western|american|pasta|spanish|mexican|european|steak|brunch/.test(c)||/양식|파스타|스테이크|브런치|비스트로|트라토리아|타코|pasta|bistro|trattoria|brunch|taco/.test(n)) return "양식";
  if(/thai|vietnamese|indian|asian|pho|nepalese|indonesian|malaysian/.test(c)||/쌀국수|포|태국|베트남|인도|커리|카레/.test(n)) return "아시안";
  if(/korean|noodle|soup|bibimbap/.test(c)||/한식|국밥|찌개|탕|냉면|칼국수|한정식|백반|국수|비빔밥|해장|순두부|감자탕|닭갈비|찜/.test(n)) return "한식";
  return "기타";
}

function dist(a,b){ // meters (haversine)
  const R=6371000, r=x=>x*Math.PI/180, dLat=r(b.lat-a.lat), dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmt = m => m<1000 ? Math.round(m)+"m" : (m/1000).toFixed(1)+"km";
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function sightType(t){
  if(t.tourism==="museum") return "박물관";
  if(t.tourism==="gallery") return "갤러리";
  if(t.tourism==="viewpoint") return "전망 명소";
  if(t.tourism==="theme_park") return "테마파크";
  if(t.tourism==="zoo"||t.tourism==="aquarium") return "동물원·아쿠아리움";
  if(t.leisure==="park") return "공원";
  if(t.historic) return "역사 유적";
  return "관광 명소";
}

const NOMI="https://nominatim.openstreetmap.org";
const sleep = ms => new Promise(r=>setTimeout(r,ms));
// "강남역, 강남대로, 역삼1동, 강남구, 서울특별시, 06xxx, 대한민국" → "서울특별시 강남구 역삼1동 강남역"
function shortLabel(s){
  const p=s.split(",").map(x=>x.trim()).filter(x=>x&&x!=="대한민국"&&!/^\d{5}$/.test(x));
  if(!p.length) return s;
  const area=p.slice(1).reverse().filter(x=>!/(로|길)(\s?\d+)?$/.test(x)).slice(0,3);
  return [...area,p[0]].filter((x,i,a)=>a.indexOf(x)===i).join(" ");
}

async function fetchJSON(url,opt={},ms=25000){
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),ms);
  try{
    const r=await fetch(url,{...opt,signal:ac.signal});
    if(!r.ok) throw new Error("서버 응답 "+r.status);
    return await r.json();
  }finally{ clearTimeout(t); }
}

async function searchLocations(q){
  const j=await fetchJSON(`${NOMI}/search?format=jsonv2&limit=8&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(q)}`);
  return j.map(x=>({lat:+x.lat,lon:+x.lon,name:x.name||q,label:shortLabel(x.display_name)}))
    .filter((x,i,a)=>a.findIndex(y=>y.label===x.label)===i);
}

async function reverseLabel(lat,lon){
  try{
    const j=await fetchJSON(`${NOMI}/reverse?format=jsonv2&zoom=16&accept-language=ko&lat=${lat}&lon=${lon}`,{},10000);
    return shortLabel(j.display_name||"");
  }catch(_){ return `${lat.toFixed(4)}, ${lon.toFixed(4)}`; }
}

// 결과 캐시 (6시간) — 데이터 서버가 불안정해도 한 번 본 동네는 바로 다시 열림
const CACHE_TTL=6*3600e3;
function cacheKey(lat,lon,R){ return `matjip-cache:${lat.toFixed(3)},${lon.toFixed(3)},${R}`; }
function cacheGet(k){ try{ const v=JSON.parse(localStorage.getItem(k)); return v&&Date.now()-v.t<CACHE_TTL?v.els:null; }catch(_){ return null; } }
function cacheSet(k,els){ try{ localStorage.setItem(k,JSON.stringify({t:Date.now(),els})); }catch(_){} }

// Overpass가 모두 실패할 때 쓰는 백업: Nominatim POI 검색 (종류별 최대 40곳)
async function nominatimPlaces(lat,lon,R){
  const dLat=R/111320, dLon=R/(111320*Math.cos(lat*Math.PI/180));
  const box=[lon-dLon,lat+dLat,lon+dLon,lat-dLat].join(",");
  const kinds=[["amenity","restaurant"],["amenity","cafe"],["amenity","fast_food"],["amenity","bar"],
    ["tourism","attraction"],["tourism","museum"],["leisure","park"]];
  const out=[];
  for(const [k,v] of kinds){
    try{
      const j=await fetchJSON(`${NOMI}/search?format=jsonv2&amenity=${v}&viewbox=${box}&bounded=1&limit=40&accept-language=ko&extratags=1&namedetails=1`,{},12000);
      for(const x of j){
        const nd=x.namedetails||{}, ex=x.extratags||{};
        if(x.category!==k) continue;
        out.push({lat:+x.lat,lon:+x.lon,tags:{...ex,name:nd["name:ko"]||nd.name||x.name,[x.category]:x.type}});
      }
    }catch(_){}
    await sleep(1100); // Nominatim 이용 정책: 초당 1회
  }
  if(!out.length) throw new Error("데이터 서버가 모두 혼잡해요. 잠시 후 다시 시도해 주세요.");
  return out.filter(e=>dist({lat,lon},e)<=R);
}

async function overpass(lat,lon,R){
  const a=`(around:${R},${lat},${lon})`;
  // 음식점과 볼거리를 따로 출력해서 음식점이 많아도 볼거리가 잘리지 않게 함
  const q=`[out:json][timeout:25];
    nwr${a}["amenity"~"^(restaurant|fast_food|cafe|bar|pub|food_court|ice_cream)$"]["name"];out center 800;
    (nwr${a}["tourism"~"^(attraction|museum|gallery|viewpoint|theme_park|zoo|aquarium)$"]["name"];
     nwr${a}["leisure"="park"]["name"];
     nwr${a}["historic"]["name"];);out center 150;`;
  // 모든 서버에 동시에 요청해서 가장 먼저 성공한 응답을 사용
  try{
    return await Promise.any(OVERPASS.map(async ep=>{
      const j=await fetchJSON(ep,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}},20000);
      if(!j.elements?.length) throw new Error("empty");
      return j.elements.map(el=>({lat:el.lat??el.center?.lat,lon:el.lon??el.center?.lon,tags:el.tags||{}}));
    }));
  }catch(_){ return null; }
}

function initMap(){
  if(map) return;
  map=L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {attribution:'&copy; OpenStreetMap',maxZoom:19,className:"dark-tiles"}).addTo(map);
  layer=L.layerGroup().addTo(map);
}

function dot(color){ return L.divIcon({className:"",html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 6px ${color}"></div>`,iconSize:[14,14]}); }

function links(p){
  const k=`https://map.kakao.com/link/map/${encodeURIComponent(p.name)},${p.lat},${p.lon}`;
  const n=`https://map.naver.com/p/search/${encodeURIComponent(p.name)}`;
  return `<a class="lnk" href="${k}" target="_blank" rel="noopener">카카오맵</a><a class="lnk alt" href="${n}" target="_blank" rel="noopener">네이버지도</a>`;
}

function renderCats(){
  const counts={}; foods.forEach(f=>counts[f.cat]=(counts[f.cat]||0)+1);
  $("#cats").innerHTML=CATS.filter(c=>c==="전체"||counts[c]).map(c=>
    `<button class="chip ${c===current?"on":""}" data-c="${c}">${ICON[c]} ${c}<b>${c==="전체"?foods.length:counts[c]}</b></button>`).join("");
}

function filtered(){ return current==="전체"?foods:foods.filter(f=>f.cat===current); }

function renderFoods(){
  const list=filtered();
  $("#recTitle").textContent=`⭐ ${current} 추천 (${list.length}곳)`;
  $("#foodList").innerHTML=list.length?list.map((f,i)=>`<div class="item" data-i="${foods.indexOf(f)}">
      <div><div class="n">${ICON[f.cat]} ${esc(f.name)}</div><div class="s">${f.cat}${f.cuisine?" · "+esc(f.cuisine):""}</div></div>
      <div class="d">${fmt(f.d)}</div></div>`).join("")
    :`<div class="s" style="color:var(--muted)">이 종류의 음식점이 없어요. 반경을 넓혀보세요.</div>`;
  drawMap(list);
  recommend();
}

function renderSights(){
  $("#sightCount").textContent=`(${sights.length}곳)`;
  $("#sightList").innerHTML=sights.length?sights.map((s,i)=>`<div class="item" data-s="${i}">
      <div><div class="n">📍 ${esc(s.name)}</div><div class="s">${s.type}</div></div>
      <div class="d">${fmt(s.d)}</div></div>`).join("")
    :`<div class="s" style="color:var(--muted)">등록된 볼거리가 없어요.</div>`;
}

function drawMap(list){
  layer.clearLayers();
  list.forEach(f=>L.marker([f.lat,f.lon],{icon:dot("#e63946")}).bindPopup(`<b>${esc(f.name)}</b><br>${f.cat} · ${fmt(f.d)}`).addTo(layer));
  sights.forEach(s=>L.marker([s.lat,s.lon],{icon:dot("#ffd166")}).bindPopup(`<b>${esc(s.name)}</b><br>${s.type} · ${fmt(s.d)}`).addTo(layer));
}

// 가까울수록 뽑힐 확률이 높은 가중 랜덤 추천
function recommend(){
  const list=filtered(), box=$("#pick");
  if(!list.length){ box.classList.add("hidden"); return; }
  const w=list.map(f=>1/(1+f.d/300)); let r=Math.random()*w.reduce((a,b)=>a+b,0), p=list[0];
  for(let i=0;i<list.length;i++){ r-=w[i]; if(r<=0){p=list[i];break;} }
  const near=sights.map(s=>({...s,dd:dist(p,s)})).sort((a,b)=>a.dd-b.dd)[0];
  box.innerHTML=`<div class="tag">🎯 오늘은 여기 어때요?</div>
    <h3>${ICON[p.cat]} ${esc(p.name)}</h3>
    <div class="meta">${p.cat}${p.cuisine?" · "+esc(p.cuisine):""} · 기준점에서 ${fmt(p.d)}${p.hours?"<br>🕒 "+esc(p.hours):""}</div>
    ${near?`<div class="meta" style="margin-top:6px">식후 코스 👉 <b style="color:var(--gold)">${esc(near.name)}</b> (${near.type}, ${fmt(near.dd)})</div>`:""}
    <div class="row"><button class="btn" id="again" type="button">🎲 다른 곳 추천</button>${links(p)}</div>`;
  box.classList.remove("hidden");
  $("#again").onclick=recommend;
  map.setView([p.lat,p.lon],16); L.popup().setLatLng([p.lat,p.lon]).setContent(`<b>${esc(p.name)}</b>`).openOn(map);
}

async function explore(){
  if(!center){ openPicker(); return; }
  const R=+$("#radius").value;
  $("#go").disabled=true;
  try{
    const key=cacheKey(center.lat,center.lon,R);
    let els=cacheGet(key);
    if(!els){
      setStatus("🔎 주변 음식점·볼거리를 수집하는 중... (최대 20초)");
      els=await overpass(center.lat,center.lon,R);
      if(!els){
        setStatus("⏳ 메인 데이터 서버가 혼잡해서 백업 서버로 수집 중... (약 10초)");
        els=await nominatimPlaces(center.lat,center.lon,R);
      }
      cacheSet(key,els);
    }
    const seen=new Set(); foods=[]; sights=[];
    for(const el of els){
      const t=el.tags, lat=el.lat, lon=el.lon;
      if(!t.name||lat==null) continue;
      const key=t.name+"|"+lat.toFixed(4)+lon.toFixed(4); if(seen.has(key)) continue; seen.add(key);
      const p={name:t["name:ko"]||t.name,lat,lon,d:dist(center,{lat,lon})};
      if(t.amenity) foods.push({...p,cat:classify(t),cuisine:t.cuisine?.split(";")[0]||"",hours:t.opening_hours||""});
      else sights.push({...p,type:sightType(t)});
    }
    foods.sort((a,b)=>a.d-b.d); sights.sort((a,b)=>a.d-b.d);
    current="전체";
    $("#result").classList.remove("hidden");
    initMap(); map.invalidateSize();
    if(homeMarker) homeMarker.remove();
    homeMarker=L.marker([center.lat,center.lon],{icon:dot("#4ea8ff")}).bindPopup("🏠 기준 위치").addTo(map);
    map.setView([center.lat,center.lon],R<=1000?15:14);
    setStatus(`✅ ${center.label} 주변 — 음식점 ${foods.length}곳, 볼거리 ${sights.length}곳`);
    renderCats(); renderSights(); renderFoods();
  }catch(err){
    setStatus("⚠️ "+(err.name==="AbortError"?"서버 응답이 너무 늦어요. 다시 시도해 주세요.":err.message||"오류가 발생했어요. 잠시 후 다시 시도해 주세요."),true);
  }finally{ $("#go").disabled=false; }
}
$("#go").addEventListener("click",explore);
$("#radius").addEventListener("change",()=>{ if(foods.length) explore(); });

/* ---------- 위치 선택 창 ---------- */
let pmap=null, pmarker=null, pending=null, cands=[];
function loadRecent(){ try{ return JSON.parse(localStorage.getItem("matjip-recent"))||[]; }catch(_){ return []; } }
function saveRecent(loc){
  const list=[loc,...loadRecent().filter(x=>x.label!==loc.label)].slice(0,5);
  try{ localStorage.setItem("matjip-recent",JSON.stringify(list)); }catch(_){}
}
function setPending(loc,zoom){
  pending=loc;
  $("#pickLabel").textContent=loc.label;
  $("#confirm").disabled=false;
  if(pmarker) pmarker.setLatLng([loc.lat,loc.lon]); else pmarker=L.marker([loc.lat,loc.lon],{icon:dot("#e63946")}).addTo(pmap);
  pmap.setView([loc.lat,loc.lon],zoom||Math.max(pmap.getZoom(),15));
}
function renderCands(list,title){
  cands=list;
  $("#cands").innerHTML=list.length?`<div class="lbl">${title}</div>`+list.map((c,i)=>
    `<button class="cand ${pending&&pending.label===c.label?"on":""}" data-k="${i}" type="button">${esc(c.name)}<small>${esc(c.label)}</small></button>`).join(""):"";
}
function openPicker(){
  $("#modal").classList.remove("hidden");
  if(!pmap){
    pmap=L.map("pmap");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'&copy; OpenStreetMap',maxZoom:19,className:"dark-tiles"}).addTo(pmap);
    pmap.setView(center?[center.lat,center.lon]:[37.5665,126.978],center?15:11);
    pmap.on("click",async e=>{
      const {lat,lng}=e.latlng;
      setPending({lat,lon:lng,name:"지도에서 선택",label:"주소 확인 중..."});
      const label=await reverseLabel(lat,lng);
      if(pending&&pending.lat===lat) setPending({lat,lon:lng,name:label.split(" ").pop(),label});
    });
  }
  setTimeout(()=>pmap.invalidateSize(),50);
  pending=center; $("#pickLabel").textContent=center?center.label:"아직 없음"; $("#confirm").disabled=!center;
  if(center) setPending(center);
  renderCands(loadRecent(),"🕘 최근 위치");
  $("#maddr").value=""; setTimeout(()=>$("#maddr").focus(),60);
}
function closePicker(){ $("#modal").classList.add("hidden"); }

$("#locBtn").addEventListener("click",openPicker);
$("#mclose").addEventListener("click",closePicker);
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closePicker(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closePicker(); });
$("#mform").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("#maddr").value.trim(); if(!q) return;
  $("#cands").innerHTML=`<div class="lbl">🔎 검색 중...</div>`;
  try{
    const list=await searchLocations(q);
    if(!list.length){ $("#cands").innerHTML=`<div class="lbl">검색 결과가 없어요. 다른 이름으로 검색하거나 지도를 눌러주세요.</div>`; return; }
    setPending(list[0]); renderCands(list,`검색 결과 ${list.length}곳 — 맞는 곳을 골라주세요`);
  }catch(err){ $("#cands").innerHTML=`<div class="lbl">⚠️ 주소 검색 실패: ${esc(err.message)}</div>`; }
});
$("#cands").addEventListener("click",e=>{
  const b=e.target.closest(".cand"); if(!b) return;
  setPending(cands[+b.dataset.k]);
  $("#cands").querySelectorAll(".cand").forEach(x=>x.classList.toggle("on",x===b));
});
$("#gps").addEventListener("click",()=>{
  if(!navigator.geolocation){ $("#cands").innerHTML=`<div class="lbl">이 브라우저는 위치 기능을 지원하지 않아요.</div>`; return; }
  $("#cands").innerHTML=`<div class="lbl">📡 현재 위치 확인 중...</div>`;
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=p.coords.latitude, lon=p.coords.longitude, label=await reverseLabel(lat,lon);
    setPending({lat,lon,name:"현재 위치",label},16); renderCands([],"");
  },err=>{ $("#cands").innerHTML=`<div class="lbl">⚠️ 위치를 가져오지 못했어요 (${err.code===1?"권한 거부됨":"확인 실패"}). 주소로 검색해 주세요.</div>`; },
  {enableHighAccuracy:true,timeout:10000});
});
$("#confirm").addEventListener("click",()=>{
  if(!pending||pending.label==="주소 확인 중...") return;
  center=pending; $("#locLabel").textContent=center.label;
  saveRecent(center);
  try{ localStorage.setItem("matjip-loc",JSON.stringify(center)); }catch(_){}
  closePicker(); explore();
});

$("#cats").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  current=b.dataset.c; renderCats(); renderFoods();
});
$("#foodList").addEventListener("click",e=>{
  const it=e.target.closest(".item"); if(!it) return; const f=foods[+it.dataset.i];
  map.setView([f.lat,f.lon],17);
  L.popup().setLatLng([f.lat,f.lon]).setContent(`<b>${esc(f.name)}</b><br>${f.cat} · ${fmt(f.d)}<div style="margin-top:8px;display:flex;gap:6px">${links(f)}</div>`).openOn(map);
});
$("#sightList").addEventListener("click",e=>{
  const it=e.target.closest(".item"); if(!it) return; const s=sights[+it.dataset.s];
  map.setView([s.lat,s.lon],16);
  L.popup().setLatLng([s.lat,s.lon]).setContent(`<b>${esc(s.name)}</b><br>${s.type}<div style="margin-top:8px;display:flex;gap:6px">${links(s)}</div>`).openOn(map);
  window.scrollTo({top:$("#map").getBoundingClientRect().top+scrollY-20,behavior:"smooth"});
});

try{ const saved=JSON.parse(localStorage.getItem("matjip-loc")); if(saved){ center=saved; $("#locLabel").textContent=saved.label; } }catch(_){}
if(!center) openPicker();
// 앱으로 설치(홈 화면·Dock 추가)하면 인터넷이 잠깐 끊겨도 화면이 열리게 한다
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
